name: Publish Server Packages

on:
  push:
    branches:
      - main

# One publish at a time: two overlapping runs race at the publish step — the earlier run's
# release commit rebases onto the later push and stamps a version/tag whose git history COVERS
# the later commit, while publishing the tarball built from its own older checkout; the later
# run then sees "no changed packages" and the newer code never ships (bit the thought repo
# 2026-07-23 thought-common 3.15.3 and 2026-08-13 thought-ui 3.33.0). The concurrency group
# serializes publish jobs; the "Abort if main advanced" guard closes the remaining window —
# only the run whose checkout is still the branch tip publishes, and the tip push's own run
# releases everything pending.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Configure git user
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
  
      - name: CI glue self-test (LockFloors.js, MintServed.js)
        # node:test, needs no install; fails the job before any minute is spent on install/build.
        run: node --test .github/scripts/LockFloors.test.js .github/scripts/MintServed.test.js

      - name: Setup NPM authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check NPM token validity
        run: |
          if ! npm_output=$(npm org ls proteinjs --json 2>&1); then
            echo "NPM token validation failed. Error details:"
            echo "$npm_output"
            exit 1
          fi
      
      - name: Install root package
        run: |
          npm i
      
      - name: Build packages
        run: |
          npm run build-workspace

      - name: Test packages
        run: |
          npm run test-workspace

      # The stale-checkout guard (see race note at top). Runs AFTER the long install/build/test
      # steps so the unguarded window shrinks from ~30 minutes to the seconds between this check
      # and lerna's push.
      - name: Abort if main advanced (stale-checkout guard)
        id: tip
        run: |
          git fetch origin main --quiet
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "is_tip=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tip=false" >> "$GITHUB_OUTPUT"
            echo "origin/main advanced past this run's checkout — skipping version+publish; the tip push's run releases everything pending (see race note at top of the workflow)."
          fi

      - name: Commit package-locks
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          git add .
          if git diff --staged --exit-code; then
            echo "No changes to commit."
          else
            git commit -m "chore(version) update package-locks [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin main
          fi

      - name: Version and Publish
        if: steps.tip.outputs.is_tip == 'true'
        run: |
          npx lerna publish --yes --no-private
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}

      - name: Re-stamp the consumer locks for the mint
        # lerna's release commit raises each sibling consumer's floor when a package it depends on
        # is published from this repo (packages/server: `@proteinjs/server-api` ^3.2.0 -> ^3.3.0)
        # and mirrors the range into the lock's root block — lerna 8.1.2's
        # update-lockfile-version.js is a JSON rewrite, and its only `npm install
        # --package-lock-only` runs on the ROOT lock, which declares no package. The lock's
        # INSTALLED entry — the pre-publish stamp the build's `npm i` wrote and the lock commit
        # above shipped — stays at the old version, so main refuses `npm ci` in every consumer
        # (EUSAGE: "lock file's @proteinjs/server-api@3.2.0 does not satisfy
        # @proteinjs/server-api@3.3.0") until someone re-stamps by hand. The registry serving the
        # mint is a WAIT, not an assumption: `lerna publish` returns on the registry's accept and
        # the packument a resolver reads lags it (a stamp asked before it serves fails with ETARGET
        # and the step leaves the tear — proteinjs/db run 36295867264, server 36075669002, user
        # 36083990691), so MintServed.js polls `npm view <name>@<version> version` for every tag
        # this run's `lerna publish` made (the tags at HEAD), 10 s apart on one 15-minute clock
        # (proteinjs/db run 36818699801: a ten-package publish had its last package served about
        # 450 s after the accept, past the 5-minute clock this step first shipped with — the lag
        # grows with the publish), one "served after N s" line per package; a package still not
        # served is a WARNING line and exit 1, and the re-stamp still tries (`|| [ $? -eq 1 ]`: only
        # a timeout goes on; git or npm unrunnable stops here). Then LockFloors.js --restamp resolves
        # the torn trees only (`npm i --package-lock-only` with this job's npm 10 — lock stamps are
        # npm-major dependent), retrying a stamp the registry refuses (ETARGET / E404) 20 s apart on
        # its own 5-minute clock before reporting the tree torn — so a package served a minute after
        # the wait expired still lands — proves every tree coherent, and the locks ride main as the
        # mint's second commit; a mint that moved no consumer floor commits nothing. Best-effort by
        # design (continue-on-error): the packages are published, so a registry still not serving
        # the mint past both clocks leaves main as lerna left it, this step red naming the floor it
        # never served, the job green; `node .github/scripts/LockFloors.js --restamp` under npm 10,
        # committed, is the hand recipe. This job sets no timeout-minutes: GitHub's default bound
        # (360 minutes) holds the 15-minute wait and the 5-minute retry clock beside the install,
        # build and test steps above.
        if: steps.tip.outputs.is_tip == 'true'
        continue-on-error: true
        run: |
          node .github/scripts/MintServed.js || [ $? -eq 1 ]
          node .github/scripts/LockFloors.js --restamp
          git add -u -- package-lock.json '*/package-lock.json'
          if git diff --staged --quiet; then
            echo "every lock agrees with the mint — nothing to commit."
          else
            git commit -m "chore(locks): consumer locks re-stamped for the mint [skip ci]"
            git push origin HEAD:main
          fi
